version: "3.9"

services:
  # ── Main: full pipeline with GPU, for ad-hoc runs ──────────────────────────
  consortium:
    build:
      context: .
      target: gpu
    image: consortium:gpu
    runtime: nvidia
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=3
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./.llm_config.yaml:/app/.llm_config.yaml:ro
    # Override command as needed:
    #   docker compose run consortium --task "Your research task" --no-counsel
    command: ["--help"]

  # ── Idea receiver: WhatsApp webhook + auto-launcher + GPU ──────────────────
  # Receives ideas via WhatsApp/web form, launches pipeline runs automatically.
  # Start with: docker compose up idea-receiver
  idea-receiver:
    build:
      context: .
      target: idea-receiver
    image: consortium:idea-receiver
    runtime: nvidia
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=3
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WEBSITE_REPO_PATH=/website
      - WEBSITE_DOMAIN=le-big-mac.github.io
    ports:
      - "5003:5003"
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      # Queue file — create before first run: touch ideas.json
      # Docker bind-mounts a missing file as a directory, so it must exist.
      - ./ideas.json:/app/ideas.json
      - ./.llm_config.yaml:/app/.llm_config.yaml:ro
      # Website repo for auto-publishing research (mount your GitHub Pages repo)
      - ~/le-big-mac.github.io:/website
      # SSH keys for git push (read-only)
      - ~/.ssh:/root/.ssh:ro
    restart: unless-stopped

  # ── Minimal: no web crawl, no Playwright, no GPU — for quick/cheap runs ────
  consortium-minimal:
    build:
      context: .
      target: minimal
    image: consortium:minimal
    env_file:
      - .env
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./.llm_config.yaml:/app/.llm_config.yaml:ro
    command: ["--help"]
