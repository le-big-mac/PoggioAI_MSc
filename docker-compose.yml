version: "3.9"

services:
  # ── Main: full pipeline with GPU, for ad-hoc runs ──────────────────────────
  consortium:
    build:
      context: .
      target: gpu
    image: consortium:gpu
    runtime: nvidia
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=3
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./.llm_config.yaml:/app/.llm_config.yaml:ro
    # Override command as needed:
    #   docker compose run consortium --task "Your research task" --no-counsel
    command: ["--help"]

  # ── Idea receiver: polls GitHub Issues, runs pipelines, publishes results ───
  # Start with: docker compose up idea-receiver
  idea-receiver:
    build:
      context: .
      target: idea-receiver
    image: consortium:idea-receiver
    runtime: nvidia
    env_file:
      - .env
    environment:
      - NVIDIA_VISIBLE_DEVICES=3
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - WEBSITE_REPO_PATH=/website
      - WEBSITE_DOMAIN=le-big-mac.github.io
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./.llm_config.yaml:/app/.llm_config.yaml:ro
      # Website repo for publishing results
      - ~/le-big-mac.github.io:/website
    restart: unless-stopped

  # ── Minimal: no web crawl, no Playwright, no GPU — for quick/cheap runs ────
  consortium-minimal:
    build:
      context: .
      target: minimal
    image: consortium:minimal
    env_file:
      - .env
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./.llm_config.yaml:/app/.llm_config.yaml:ro
    command: ["--help"]
